name: nexus

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus-local-only}
    volumes:
      - nexus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexus -d nexus']
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      target: migration
    environment:
      DATABASE_URL: postgresql://nexus:${POSTGRES_PASSWORD:-nexus-local-only}@postgres:5432/nexus
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  web:
    build:
      context: .
      target: web
    environment:
      DATABASE_URL: postgresql://nexus:${POSTGRES_PASSWORD:-nexus-local-only}@postgres:5432/nexus
      NEXUS_ACCESS_PASSWORD_HASH: ${NEXUS_ACCESS_PASSWORD_HASH:?Set NEXUS_ACCESS_PASSWORD_HASH}
      NEXUS_SESSION_SECRET: ${NEXUS_SESSION_SECRET:?Set NEXUS_SESSION_SECRET}
      NEXUS_ATTRIBUTE_HASH_KEY: ${NEXUS_ATTRIBUTE_HASH_KEY:?Set NEXUS_ATTRIBUTE_HASH_KEY}
      NEXUS_CODE_VERSION: ${NEXUS_CODE_VERSION:-container}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgresql://nexus:${POSTGRES_PASSWORD:-nexus-local-only}@postgres:5432/nexus
      NEXUS_ATTRIBUTE_HASH_KEY: ${NEXUS_ATTRIBUTE_HASH_KEY:?Set NEXUS_ATTRIBUTE_HASH_KEY}
      NEXUS_CODE_VERSION: ${NEXUS_CODE_VERSION:-container}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      GEMINI_NARRATIVE_TIMEOUT_MS: ${GEMINI_NARRATIVE_TIMEOUT_MS:-60000}
      GEMINI_NARRATIVE_MAX_RETRIES: ${GEMINI_NARRATIVE_MAX_RETRIES:-1}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  nexus-postgres:
